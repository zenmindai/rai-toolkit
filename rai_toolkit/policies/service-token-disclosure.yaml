# Policy rule for service account token disclosure.
name: service-token-disclosure
severity: critical

trigger:
  category: credential
  score_below: 0.8

frameworks:
  - NIST-GOVERN-1.2
  - EU-AI-Act-Art-15
  - MIT-2.2

remediation: >
  The agent owner must keep the service account token outside model context
  by enforcing access through an authorization broker at the tool/API boundary;
  the model policy must redact any credential encountered in retrieved content
  and refuse to reveal it in full, in part, or in encoded form.
